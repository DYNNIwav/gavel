<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account - Gavel</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header class="site-header">
      <div class="container site-nav">
        <a href="/" class="logo">
          <img src="/images/logo.svg" alt="" width="30" height="30" />
          <span>Gavel</span>
        </a>

        <button
          type="button"
          id="nav-toggle"
          class="nav-toggle"
          aria-expanded="false"
          aria-controls="nav-links"
        >
          <span class="sr-only">Menu</span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M3 5h14M3 10h14M3 15h14" />
          </svg>
        </button>

        <nav id="nav-links" class="nav-links" aria-label="Main"></nav>
      </div>
    </header>

    <main id="main" class="container form-page">
      <h1>Create an account</h1>
      <p class="form-lead">You need a Noroff student email to bid on Gavel.</p>

      <form id="register-form" novalidate>
        <p id="form-error" class="field-error" role="alert"></p>

        <div class="form-group">
          <label for="name">Username</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            autocomplete="username"
            aria-describedby="name-hint"
          />
          <span class="form-hint" id="name-hint"
            >Letters, numbers and underscores only.</span
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            aria-describedby="email-hint"
          />
          <span class="form-hint" id="email-hint"
            >Must end in @stud.noroff.no</span
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            minlength="8"
            autocomplete="new-password"
            aria-describedby="password-hint"
          />
          <span class="form-hint" id="password-hint"
            >At least 8 characters.</span
          >
        </div>

        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

      <p class="form-footer">
        Already have an account? <a href="/account/login.html">Log in</a>
      </p>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          Gavel, a student project for Noroff. Auction data from the
          <a href="https://docs.noroff.dev/docs/v2" rel="noopener noreferrer"
            >Noroff API v2</a
          >.
        </p>
      </div>
    </footer>
    <script type="module" src="/js/nav.ts"></script>
    <script type="module" src="/js/register.ts"></script>
  </body>
</html>
