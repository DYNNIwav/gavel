<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist - Gavel</title>
    <meta
      name="description"
      content="Keep track of auction items you are interested in on Gavel.">
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header class="site-header">
      <div class="shell site-nav">
        <a href="/" class="logo">
          <img src="/images/logo.svg" alt="" width="30" height="30">
          <span>Gavel</span>
        </a>

        <button
          type="button"
          id="nav-toggle"
          class="nav-toggle"
          aria-expanded="false"
          aria-controls="nav-links"
        >
          <span class="sr-only">Menu</span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M3 5h14M3 10h14M3 15h14" />
          </svg>
        </button>

        <nav id="nav-links" class="nav-links" aria-label="Main"></nav>
      </div>
    </header>

    <main id="main" class="shell page-section">
      <div class="page-heading">
        <h1>My Watchlist</h1>
        <p class="form-lead">Saved auctions you are keeping an eye on.</p>
      </div>

      <div id="watchlist-grid" class="listing-grid">
        <p class="empty-state">Loading your saved items...</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell">
        <p>
          Gavel, a student project for Noroff. Auction data from the
          <a href="https://docs.noroff.dev/docs/v2" rel="noopener noreferrer"
            >Noroff API v2</a
          >.
        </p>
      </div>
    </footer>
    <script type="module" src="/js/nav.ts"></script>
    <script type="module" src="/js/watchlist.ts"></script>
  </body>
</html>
