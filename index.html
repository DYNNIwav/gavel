<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gavel, the campus auction house</title>
    <meta
      name="description"
      content="Gavel is a student-only auction marketplace. Buy and sell cameras, instruments, tech, textbooks and furniture with other Noroff students."
    />
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header class="site-header">
      <div class="shell site-nav">
        <a href="/" class="logo">
          <img src="/images/logo.svg" alt="" width="30" height="30" />
          <span>Gavel</span>
        </a>

        <button
          type="button"
          id="nav-toggle"
          class="nav-toggle"
          aria-expanded="false"
          aria-controls="nav-links"
        >
          <span class="sr-only">Menu</span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M3 5h14M3 10h14M3 15h14" />
          </svg>
        </button>

        <nav id="nav-links" class="nav-links" aria-label="Main"></nav>
      </div>
    </header>

    <main id="main">
      <section class="shell hero">
        <h1>The campus auction house</h1>
        <p class="hero-lead">
          Cameras, guitars, monitors, textbooks and the desk that will not fit
          in your next flat. Sold to other students, one bid at a time.
        </p>
      </section>

      <section class="shell" aria-labelledby="listings-heading">
        <h2 id="listings-heading">Open lots</h2>

        <div class="listings-controls">
          <form id="search-form" class="search-form" role="search">
            <label for="search-input" class="sr-only">Search listings</label>
            <input
              type="search"
              id="search-input"
              name="q"
              placeholder="Search listings..."
            />
            <button type="submit" class="btn btn-primary">Search</button>
          </form>

          <div class="filter-sort-group">
            <label for="sort-select" class="sr-only">Sort listings</label>
            <select id="sort-select" class="select-control">
              <option value="created-desc">Newest</option>
              <option value="created-asc">Oldest</option>
              <option value="endsAt-asc">Ending soonest</option>
            </select>

            <label for="tag-select" class="sr-only">Filter by category</label>
            <select id="tag-select" class="select-control">
              <option value="">All categories</option>
              <option value="Photo and Film">Photo and Film</option>
              <option value="Music">Music</option>
              <option value="Tech">Tech</option>
              <option value="Books and Study">Books and Study</option>
              <option value="Art and Design">Art and Design</option>
              <option value="Home and Dorm">Home and Dorm</option>
              <option value="Sport and Outdoor">Sport and Outdoor</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div id="listings" class="listing-grid">
          <p class="empty-state">Loading listings...</p>
        </div>

        <div id="load-more-row" class="load-more-row" hidden>
          <button type="button" id="load-more" class="btn btn-secondary">
            Load more listings
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="shell">
        <p>
          Gavel, a student project for Noroff. Auction data from the
          <a href="https://docs.noroff.dev/docs/v2" rel="noopener noreferrer"
            >Noroff API v2</a
          >.
        </p>
      </div>
    </footer>
    <script type="module" src="/js/nav.ts"></script>
    <script type="module" src="/js/main.ts"></script>
  </body>
</html>
